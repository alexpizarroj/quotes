name: Quote of the day

on:
  schedule:
    # Hourly as an experiment: GitHub ran the single daily slot 8 to 12 hours late.
    # Extra runs are harmless, because the day's pick is made once and then reused.
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths: [quotes.md, scripts/**, .github/workflows/daily.yml]
  workflow_dispatch:
    inputs:
      reroll:
        description: Pick a different quote for today
        type: boolean
        default: true

permissions: {}

concurrency:
  group: quote-of-the-day
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # a queued run must start from the latest history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Pick today's quote
        run: python scripts/pick.py ${{ inputs.reroll && '--reroll' || '' }}
      - name: Render the widget image
        run: sh scripts/render.sh
      - name: Save the pick to history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || git commit -m "Quote of the day: $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # A separate job: deploy-pages can miss an artifact uploaded moments earlier
  # in its own job (actions/deploy-pages#451).
  deploy:
    needs: pick
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
