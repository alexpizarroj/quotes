name: Quote of the day

on:
  schedule:
    - cron: "0 8 * * *" # 04:00 in Bolivia (UTC-4)
  push:
    branches: [main]
    paths: [quotes.md, scripts/**, .github/workflows/daily.yml]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: quote-of-the-day
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # a queued run must start from the latest history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pick today's quote
        run: python scripts/pick.py
      - name: Render the widget image
        run: sh scripts/render.sh
      - name: Save the pick to history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || git commit -m "Quote of the day: $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
