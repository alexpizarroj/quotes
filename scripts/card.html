<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&family=Inter:wght@400;600&display=block">
<style>
  /* Same design as the Mac widget, rendered to an image for the phone widget.
     380x200 matches a full-width, two-row widget on the phone's home screen. */
  html, body { margin: 0; background: transparent; }
  .card { width: 380px; height: 200px; box-sizing: border-box; padding: 12px 20px; overflow: hidden; display: flex; flex-direction: column; justify-content: center; border-radius: 24px; background: rgba(0, 10, 44, 0.8); border: 0.5px solid rgba(255, 255, 255, 0.12); color: rgba(255, 255, 255, 0.95); font-family: Inter, sans-serif; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255, 255, 255, 0.55); margin-bottom: 8px; }
  .line { font-family: Newsreader, Georgia, serif; font-size: 18.5px; line-height: 1.38; margin: 0 0 4px; }
  .medium .line { font-size: 16px; line-height: 1.34; margin-bottom: 3px; }
  .long .line { font-size: 14px; line-height: 1.3; margin-bottom: 2px; }
  .long .label { display: none; }
  .gap { height: 5px; }
  .by { margin-top: 10px; font-size: 12px; color: rgba(255, 255, 255, 0.6); }
  .long .by { margin-top: 6px; }
</style>
<div class="card"><div id="content"></div></div>
<script>
  const quote = __QUOTE__;
  const content = document.getElementById("content");
  const add = (tag, cls, text) => { const el = document.createElement(tag); el.className = cls; el.textContent = text || ""; content.append(el); };
  const length = quote.text.length, lines = quote.paragraphs.length;
  content.className = length > 240 || lines >= 4 ? "long" : length > 150 || lines >= 2 ? "medium" : "";
  add("div", "label", "Quote of the day");
  for (const line of quote.paragraphs) line ? add("p", "line", line) : add("div", "gap");
  add("div", "by", [quote.author, quote.source].filter(Boolean).join(", "));
  // Shrink the content until it fits the card, so long quotes are never cut off.
  const room = content.parentElement.clientHeight - 24;
  for (let zoom = 1; zoom > 0.6 && content.getBoundingClientRect().height > room; zoom -= 0.02) content.style.zoom = zoom;
  document.title = content.style.zoom || "1";
</script>
